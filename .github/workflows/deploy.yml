# Production Deployment Workflow
# 
# This workflow automatically deploys database migrations to production Supabase
# when code is pushed to the main branch.
#
# Required GitHub Secrets (in production environment):
# - SUPABASE_ACCESS_TOKEN: From Supabase Dashboard → Settings → Access Tokens
# - SUPABASE_PROJECT_REF: Your project reference ID from project URL
#
# The workflow installs Supabase CLI using the official binary installer
# which is the recommended method for CI/CD environments.
#
# For setup instructions, see: docs/deployment/GITHUB-SECRETS-SETUP.md

name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allow manual triggering

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production # Require environment protection rules
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # Ensure we get the full repository including all subdirectories
        fetch-depth: 0
        # Force clean checkout to avoid conflicts
        clean: true
        
    - name: Debug repository structure
      run: |
        echo "📍 Repository checkout completed"
        echo "📂 Root directory contents:"
        ls -la
        echo "🔍 Looking for migrations directory..."
        find . -name "migrations" -type d 2>/dev/null || echo "No migrations directories found"
        find . -name "supabase" -type d 2>/dev/null || echo "No supabase directories found"
        
        # Check if we have the nested structure
        if [ -d "prompt-board" ]; then
          echo "📁 Found nested prompt-board directory"
          ls -la prompt-board/
          if [ -d "prompt-board/supabase" ]; then
            echo "📁 Found nested supabase directory"
            ls -la prompt-board/supabase/
          fi
        fi
        
        # Force check git status
        echo "🔍 Git repository status:"
        git status
        git ls-files | grep migrations || echo "No migrations files tracked by git"
        
    - name: Restore migrations if missing
      run: |
        if [ ! -d "supabase/migrations" ] || [ -z "$(ls -A supabase/migrations 2>/dev/null)" ]; then
          echo "❌ Migrations directory missing or empty, attempting to restore..."
          
          # Force restore from git
          git checkout HEAD -- supabase/migrations/ || echo "Git checkout failed"
          
          # If that fails, try reset
          if [ ! -d "supabase/migrations" ]; then
            echo "🔧 Trying git reset to restore files..."
            git reset --hard HEAD
          fi
          
          # Final check
          if [ -d "supabase/migrations" ] && [ -n "$(ls -A supabase/migrations 2>/dev/null)" ]; then
            echo "✅ Migrations directory restored successfully"
            ls -la supabase/migrations/
          else
            echo "❌ Failed to restore migrations directory"
            echo "This might be a repository structure issue"
            exit 1
          fi
        else
          echo "✅ Migrations directory exists and contains files"
          ls -la supabase/migrations/
        fi
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run unit tests
      run: npm run test:unit
      
    - name: Build application
      run: npm run build
      
    - name: Install Supabase CLI
      run: |
        # Install Supabase CLI directly from GitHub releases (most reliable for CI/CD)
        echo "📦 Installing Supabase CLI from GitHub releases..."
        
        # Ensure jq is available (should be pre-installed on GitHub runners)
        if ! command -v jq &> /dev/null; then
          echo "Installing jq..."
          sudo apt-get update && sudo apt-get install -y jq
        fi
        
        # Create the bin directory
        mkdir -p "$HOME/.local/bin"
        
        # Clean any existing supabase files to avoid conflicts
        rm -f supabase supabase-cli.tar.gz 2>/dev/null || true
        rm -rf temp-supabase 2>/dev/null || true
        
        # Get the latest release version with better error handling
        echo "🔍 Getting latest Supabase CLI version..."
        SUPABASE_VERSION=$(curl -s https://api.github.com/repos/supabase/cli/releases/latest | jq -r '.tag_name // empty')
        
        # Fallback to known working version if API fails
        if [ -z "$SUPABASE_VERSION" ] || [ "$SUPABASE_VERSION" = "null" ]; then
          echo "⚠️  GitHub API failed to return version, using fallback version..."
          SUPABASE_VERSION="v2.31.8"
          echo "📦 Using fallback Supabase CLI version: $SUPABASE_VERSION"
        else
          echo "📦 Using latest Supabase CLI version: $SUPABASE_VERSION"
        fi
        
        # Download and extract the binary (using the correct filename)
        DOWNLOAD_URL="https://github.com/supabase/cli/releases/download/${SUPABASE_VERSION}/supabase_linux_amd64.tar.gz"
        echo "🔗 Download URL: $DOWNLOAD_URL"
        
        if wget -q -O supabase-cli.tar.gz "$DOWNLOAD_URL"; then
          echo "✅ Download successful"
          
          # Extract to a temporary directory to avoid conflicts
          mkdir -p temp-supabase
          tar -xzf supabase-cli.tar.gz -C temp-supabase
          
          # Move the binary to the final location
          if [ -f "temp-supabase/supabase" ]; then
            mv temp-supabase/supabase "$HOME/.local/bin/supabase"
          elif [ -f "supabase" ]; then
            # Fallback: if extracted to current directory
            mv supabase "$HOME/.local/bin/supabase"
          else
            echo "❌ Could not find supabase binary after extraction"
            echo "Contents of temp-supabase:"
            ls -la temp-supabase/ 2>/dev/null || echo "temp-supabase directory not found"
            echo "Contents of current directory:"
            ls -la . | grep supabase || echo "No supabase files found"
            exit 1
          fi
          
          chmod +x "$HOME/.local/bin/supabase"
          rm -rf supabase-cli.tar.gz temp-supabase supabase 2>/dev/null || true
          echo "✅ Installation completed"
        else
          echo "❌ Failed to download Supabase CLI from: $DOWNLOAD_URL"
          
          # Try to get available versions for debugging
          echo "🔍 Checking available releases..."
          RELEASES_INFO=$(curl -s https://api.github.com/repos/supabase/cli/releases/latest 2>/dev/null || echo "{}")
          echo "API Response: $RELEASES_INFO"
          
          if [ "$RELEASES_INFO" != "{}" ]; then
            echo "Available assets:"
            echo "$RELEASES_INFO" | jq -r '.assets[]?.name // "No assets found"' 2>/dev/null || echo "Failed to parse assets"
          fi
          
          exit 1
        fi
        
        # Add to PATH for this job
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        
        # Verify the binary exists and is executable
        if [ -f "$HOME/.local/bin/supabase" ] && [ -x "$HOME/.local/bin/supabase" ]; then
          echo "✅ Supabase CLI binary installed successfully"
          ls -la "$HOME/.local/bin/supabase"
          file "$HOME/.local/bin/supabase"
        else
          echo "❌ Supabase CLI binary not found or not executable after installation"
          echo "Contents of $HOME/.local/bin:"
          ls -la "$HOME/.local/bin/" 2>/dev/null || echo "Directory does not exist"
          exit 1
        fi
        
    - name: Install PostgreSQL client
      run: |
        echo "📦 Installing PostgreSQL client for direct database access..."
        sudo apt-get update
        sudo apt-get install -y postgresql-client
        
        # Verify installation
        psql --version
        echo "✅ PostgreSQL client installed successfully"
        
    - name: Verify Supabase CLI installation
      run: |
        # Wait a moment for PATH to be updated
        sleep 2
        
        # Verify CLI is accessible and working
        echo "🔍 Verifying Supabase CLI installation..."
        which supabase
        supabase --version
        echo "✅ Supabase CLI verified and ready"
        
    - name: Deploy database migrations
      env:
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: |
        echo "🚀 Starting database migration deployment..."
        
        # Debug: Show current directory and structure
        echo "📍 Current working directory: $(pwd)"
        echo "📂 Directory contents:"
        ls -la
        
        # Check for migrations directory in multiple locations
        if [ -d "supabase/migrations" ]; then
          echo "✅ Found migrations at: supabase/migrations"
          ls -la supabase/migrations/
        elif [ -d "prompt-board/supabase/migrations" ]; then
          echo "✅ Found migrations at: prompt-board/supabase/migrations"
          ls -la prompt-board/supabase/migrations/
          cd prompt-board
          echo "📍 Changed working directory to: $(pwd)"
        else
          echo "❌ Cannot find migrations directory"
          echo "Available directories:"
          find . -name "migrations" -type d 2>/dev/null || echo "No migrations directories found"
          exit 1
        fi
        
        # Validate secrets are available (without exposing values)
        if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
          echo "❌ SUPABASE_ACCESS_TOKEN secret is not set"
          echo "Please add this secret to your GitHub repository settings"
          exit 1
        fi
        
        if [ -z "$SUPABASE_PROJECT_REF" ]; then
          echo "❌ SUPABASE_PROJECT_REF secret is not set"
          echo "Please add this secret to your GitHub repository settings"
          exit 1
        fi
        
        echo "✅ Required secrets are available"
        echo "📋 Project ref format: ${#SUPABASE_PROJECT_REF} characters"
        
        # Check if service role key is available (recommended)
        if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
          echo "✅ Service role key detected - will use for direct database access"
        else
          echo "⚠️  Service role key not set - will use CLI method (less reliable)"
          echo "💡 Recommendation: Add SUPABASE_SERVICE_ROLE_KEY secret for better reliability"
        fi
        
        chmod +x ./scripts/deploy-migrations.sh
        ./scripts/deploy-migrations.sh
        
    - name: Notify deployment success
      if: success()
      run: |
        echo "✅ Deployment completed successfully!"
        echo "- Database migrations applied"
        echo "- Application ready for production"
