# Production Deployment Workflow
# 
# This workflow automatically deploys database migrations to production Supabase
# when code is pushed to the main branch.
#
# Required GitHub Secrets (in production environment):
# - SUPABASE_ACCESS_TOKEN: From Supabase Dashboard → Settings → Access Tokens
# - SUPABASE_PROJECT_REF: Your project reference ID from project URL
#
# The workflow installs Supabase CLI using the official binary installer
# which is the recommended method for CI/CD environments.
#
# For setup instructions, see: docs/deployment/GITHUB-SECRETS-SETUP.md

name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allow manual triggering

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production # Require environment protection rules
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run unit tests
      run: npm run test:unit
      
    - name: Build application
      run: npm run build
      
    - name: Install Supabase CLI
      run: |
        # Install Supabase CLI directly from GitHub releases (most reliable for CI/CD)
        echo "📦 Installing Supabase CLI from GitHub releases..."
        
        # Ensure jq is available (should be pre-installed on GitHub runners)
        if ! command -v jq &> /dev/null; then
          echo "Installing jq..."
          sudo apt-get update && sudo apt-get install -y jq
        fi
        
        # Create the bin directory
        mkdir -p "$HOME/.local/bin"
        
        # Get the latest release version for logging
        echo "🔍 Getting latest Supabase CLI version..."
        SUPABASE_VERSION=$(curl -s https://api.github.com/repos/supabase/cli/releases/latest | jq -r '.tag_name')
        echo "📦 Downloading Supabase CLI version $SUPABASE_VERSION..."
        
        # Download and extract the binary (using the correct filename)
        if wget -q -O supabase-cli.tar.gz "https://github.com/supabase/cli/releases/download/${SUPABASE_VERSION}/supabase_linux_amd64.tar.gz"; then
          echo "✅ Download successful"
          tar -xzf supabase-cli.tar.gz
          mv supabase "$HOME/.local/bin/supabase"
          chmod +x "$HOME/.local/bin/supabase"
          rm -f supabase-cli.tar.gz
          echo "✅ Installation completed"
        else
          echo "❌ Failed to download Supabase CLI"
          echo "Available assets for version $SUPABASE_VERSION:"
          curl -s https://api.github.com/repos/supabase/cli/releases/latest | jq -r '.assets[].name' | grep -E '\.(tar\.gz|zip)' || echo "No tar.gz or zip assets found"
          exit 1
        fi
        
        # Add to PATH for this job
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        
        # Verify the binary exists and is executable
        if [ -f "$HOME/.local/bin/supabase" ] && [ -x "$HOME/.local/bin/supabase" ]; then
          echo "✅ Supabase CLI binary installed successfully"
          ls -la "$HOME/.local/bin/supabase"
          file "$HOME/.local/bin/supabase"
        else
          echo "❌ Supabase CLI binary not found or not executable after installation"
          echo "Contents of $HOME/.local/bin:"
          ls -la "$HOME/.local/bin/" 2>/dev/null || echo "Directory does not exist"
          exit 1
        fi
        
    - name: Verify Supabase CLI installation
      run: |
        # Wait a moment for PATH to be updated
        sleep 2
        
        # Verify CLI is accessible and working
        echo "🔍 Verifying Supabase CLI installation..."
        which supabase
        supabase --version
        echo "✅ Supabase CLI verified and ready"
        
    - name: Deploy database migrations
      env:
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      run: |
        echo "🚀 Starting database migration deployment..."
        chmod +x ./scripts/deploy-migrations.sh
        ./scripts/deploy-migrations.sh
        
    - name: Notify deployment success
      if: success()
      run: |
        echo "✅ Deployment completed successfully!"
        echo "- Database migrations applied"
        echo "- Application ready for production"
