# Production Deployment Workflow
# 
# This workflow automatically deploys database migrations to production Supabase
# when code is pushed to the main branch.
#
# Required GitHub Secrets (in production environment):
# - SUPABASE_ACCESS_TOKEN: From Supabase Dashboard → Settings → Access Tokens
# - SUPABASE_PROJECT_REF: Your project reference ID from project URL
#
# The workflow uses the official Supabase CLI method recommended for CI/CD.
# This is more reliable and secure than direct database connections.
#
# For setup instructions, see: docs/deployment/GITHUB-SECRETS-SETUP.md

name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allow manual triggering

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production # Require environment protection rules
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        # Use v3 which has more stable behavior
        fetch-depth: 0
        
    - name: Force ensure migrations directory exists
      run: |
        echo "🔧 Verifying repository checkout and structure..."
        
        # Show current directory and git status
        echo "📍 Working directory: $(pwd)"
        echo "🔍 Git status:"
        git status --porcelain || echo "Git status failed"
        
        # List all files to see what was actually checked out
        echo "📂 All files in repository:"
        find . -name "*.sql" 2>/dev/null || echo "No SQL files found"
        find . -name "migrations" -type d 2>/dev/null || echo "No migrations directories found"
        
        # Explicit check for the supabase directory
        if [ -d ".git" ]; then
          echo "✅ Git repository confirmed"
          
          # Force ensure supabase/migrations is available
          # Check if migrations files are actually present (we saw them in find output)
          if [ -z "$(find . -name "*.sql" -path "*/supabase/migrations/*" 2>/dev/null)" ]; then
            echo "❌ supabase/migrations SQL files not found on filesystem"
            echo "Git tree contents:"
            git ls-tree -r HEAD | grep -E "(supabase|migrations)" || echo "No supabase/migrations entries"
            exit 1
          else
            echo "✅ supabase/migrations SQL files found on filesystem"
            
            # Force checkout the specific directory if it's missing
            if [ ! -d "supabase/migrations" ]; then
              echo "� Force restoring supabase/migrations from git..."
              git checkout HEAD -- supabase/ || echo "Checkout failed"
              
              # If still missing, this is a serious issue
              if [ ! -d "supabase/migrations" ]; then
                echo "❌ Critical: Cannot restore supabase/migrations"
                echo "Available supabase files:"
                git ls-tree -r HEAD | grep supabase || echo "No supabase files in git"
                exit 1
              fi
            fi
            
            echo "✅ supabase/migrations directory confirmed"
            ls -la supabase/migrations/
          fi
        else
          echo "❌ Not a git repository - checkout failed"
          exit 1
        fi
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    #- name: Run unit tests
     # run: npm run test:unit
      
    - name: Build application
      run: npm run build
      
    - name: Install Supabase CLI
      run: |
        # Install Supabase CLI directly from GitHub releases (most reliable for CI/CD)
        echo "📦 Installing Supabase CLI from GitHub releases..."
        
        # Ensure jq is available (should be pre-installed on GitHub runners)
        if ! command -v jq &> /dev/null; then
          echo "Installing jq..."
          sudo apt-get update && sudo apt-get install -y jq
        fi
        
        # Create the bin directory
        mkdir -p "$HOME/.local/bin"
        
        # Clean any existing supabase files to avoid conflicts
        rm -f supabase supabase-cli.tar.gz 2>/dev/null || true
        rm -rf temp-supabase 2>/dev/null || true
        
        # Get the latest release version with better error handling
        echo "🔍 Getting latest Supabase CLI version..."
        SUPABASE_VERSION=$(curl -s https://api.github.com/repos/supabase/cli/releases/latest | jq -r '.tag_name // empty')
        
        # Fallback to known working version if API fails
        if [ -z "$SUPABASE_VERSION" ] || [ "$SUPABASE_VERSION" = "null" ]; then
          echo "⚠️  GitHub API failed to return version, using fallback version..."
          SUPABASE_VERSION="v2.31.8"
          echo "📦 Using fallback Supabase CLI version: $SUPABASE_VERSION"
        else
          echo "📦 Using latest Supabase CLI version: $SUPABASE_VERSION"
        fi
        
        # Download and extract the binary (using the correct filename)
        DOWNLOAD_URL="https://github.com/supabase/cli/releases/download/${SUPABASE_VERSION}/supabase_linux_amd64.tar.gz"
        echo "🔗 Download URL: $DOWNLOAD_URL"
        
        if wget -q -O supabase-cli.tar.gz "$DOWNLOAD_URL"; then
          echo "✅ Download successful"
          
          # Extract to a temporary directory to avoid conflicts
          mkdir -p temp-supabase
          tar -xzf supabase-cli.tar.gz -C temp-supabase
          
          # Move the binary to the final location
          if [ -f "temp-supabase/supabase" ]; then
            mv temp-supabase/supabase "$HOME/.local/bin/supabase"
          elif [ -f "supabase" ]; then
            # Fallback: if extracted to current directory
            mv supabase "$HOME/.local/bin/supabase"
          else
            echo "❌ Could not find supabase binary after extraction"
            echo "Contents of temp-supabase:"
            ls -la temp-supabase/ 2>/dev/null || echo "temp-supabase directory not found"
            echo "Contents of current directory:"
            ls -la . | grep supabase || echo "No supabase files found"
            exit 1
          fi
          
          chmod +x "$HOME/.local/bin/supabase"
          rm -rf supabase-cli.tar.gz temp-supabase supabase 2>/dev/null || true
          echo "✅ Installation completed"
        else
          echo "❌ Failed to download Supabase CLI from: $DOWNLOAD_URL"
          
          # Try to get available versions for debugging
          echo "🔍 Checking available releases..."
          RELEASES_INFO=$(curl -s https://api.github.com/repos/supabase/cli/releases/latest 2>/dev/null || echo "{}")
          echo "API Response: $RELEASES_INFO"
          
          if [ "$RELEASES_INFO" != "{}" ]; then
            echo "Available assets:"
            echo "$RELEASES_INFO" | jq -r '.assets[]?.name // "No assets found"' 2>/dev/null || echo "Failed to parse assets"
          fi
          
          exit 1
        fi
        
        # Add to PATH for this job
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        
        # Verify the binary exists and is executable
        if [ -f "$HOME/.local/bin/supabase" ] && [ -x "$HOME/.local/bin/supabase" ]; then
          echo "✅ Supabase CLI binary installed successfully"
          ls -la "$HOME/.local/bin/supabase"
          file "$HOME/.local/bin/supabase"
        else
          echo "❌ Supabase CLI binary not found or not executable after installation"
          echo "Contents of $HOME/.local/bin:"
          ls -la "$HOME/.local/bin/" 2>/dev/null || echo "Directory does not exist"
          exit 1
        fi
        
    - name: Remove PostgreSQL client installation (not needed for CLI method)
      run: |
        echo "📦 Using official Supabase CLI method - PostgreSQL client not required"
        echo "✅ Modern best practice: CLI uses Management API instead of direct DB connections"
        
    - name: Restore supabase directory before deployment
      run: |
        echo "🔧 Ensuring supabase directory is available for deployment..."
        
        # Check current state
        echo "📍 Current directory: $(pwd)"
        if [ -d "supabase" ]; then
          echo "✅ supabase directory exists"
          if [ -d "supabase/migrations" ]; then
            echo "✅ supabase/migrations exists with $(ls supabase/migrations/*.sql 2>/dev/null | wc -l) SQL files"
          else
            echo "❌ supabase/migrations missing"
          fi
        else
          echo "❌ supabase directory missing entirely"
        fi
        
        # Force restore from git if missing
        if [ ! -d "supabase" ] || [ ! -d "supabase/migrations" ]; then
          echo "🔄 Restoring supabase directory from git..."
          
          # Show what's in git first
          echo "Files in git under supabase/:"
          git ls-files | grep "^supabase/" | head -20
          
          # Force checkout the directory
          git checkout HEAD -- supabase/ || {
            echo "❌ Git checkout failed"
            git status
            exit 1
          }
        fi
        
        # Final verification
        if [ -d "supabase/migrations" ]; then
          echo "✅ supabase/migrations confirmed with files:"
          ls -la supabase/migrations/
        else
          echo "❌ Still cannot access supabase/migrations after restore"
          exit 1
        fi
        
    - name: Verify Supabase CLI installation
      run: |
        # Wait a moment for PATH to be updated
        sleep 2
        
        # Verify CLI is accessible and working
        echo "🔍 Verifying Supabase CLI installation..."
        which supabase
        supabase --version
        echo "✅ Supabase CLI verified and ready"
        
    - name: Deploy database migrations using official CLI method
      env:
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      run: |
        echo "🚀 Starting database migration deployment using official CLI method..."
        
        # Validate required secrets are available
        if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
          echo "❌ SUPABASE_ACCESS_TOKEN secret is not set"
          echo "Please add this secret to your GitHub repository settings"
          echo "💡 Generate token at: https://supabase.com/dashboard/account/tokens"
          exit 1
        fi
        
        if [ -z "$SUPABASE_PROJECT_REF" ]; then
          echo "❌ SUPABASE_PROJECT_REF secret is not set"
          echo "Please add this secret to your GitHub repository settings"
          echo "💡 Get project ref from your dashboard URL: https://supabase.com/dashboard/project/YOUR_PROJECT_REF"
          exit 1
        fi
        
        echo "✅ Required secrets are available"
        echo "📋 Project ref format: ${#SUPABASE_PROJECT_REF} characters"
        echo "🎯 Using modern CLI method (recommended for CI/CD)"
        
        # Check for migrations directory
        if [ -d "supabase/migrations" ]; then
          MIGRATION_COUNT=$(ls supabase/migrations/*.sql 2>/dev/null | wc -l)
          echo "✅ Found migrations directory with $MIGRATION_COUNT migration files"
          
          # List migration files for debugging
          echo "📋 Migration files:"
          ls -1 supabase/migrations/*.sql 2>/dev/null | sort | sed 's/^/  - /'
        else
          echo "❌ Cannot find supabase/migrations directory"
          echo "📍 Current directory: $(pwd)"
          echo "📂 Available directories:"
          find . -type d -name "*" | head -20
          exit 1
        fi
        
        # Login to Supabase using access token (required for CLI operations)
        echo "🔐 Authenticating with Supabase using access token..."
        if ! echo "$SUPABASE_ACCESS_TOKEN" | supabase login --token "$(cat)"; then
          echo "❌ Failed to authenticate with Supabase"
          echo "💡 Check if your SUPABASE_ACCESS_TOKEN is valid"
          echo "💡 Generate new token at: https://supabase.com/dashboard/account/tokens"
          exit 1
        fi
        echo "✅ Successfully authenticated with Supabase"
        
        # Link to project using official CLI method
        echo "🔗 Linking to Supabase project..."
        if ! supabase link --project-ref "$SUPABASE_PROJECT_REF"; then
          echo "❌ Failed to link to Supabase project"
          echo "💡 Verify your project ref: $SUPABASE_PROJECT_REF"
          echo "💡 Check project exists at: https://supabase.com/dashboard/project/$SUPABASE_PROJECT_REF"
          echo "💡 Ensure your access token has the correct permissions"
          exit 1
        fi
        echo "✅ Successfully linked to project"
        
        # Deploy migrations using the recommended CLI command with enhanced error handling
        echo "📤 Deploying migrations using supabase db push..."
        if ! supabase db push; then
          echo "❌ Failed to deploy migrations"
          echo ""
          echo "🔍 Troubleshooting steps:"
          echo "1. Check if your access token has 'Database Admin' permissions"
          echo "2. Verify the project ref matches your project"
          echo "3. Ensure migrations are valid SQL"
          echo "4. Check migration history: supabase migration list"
          echo ""
          echo "💡 Try running with debug: supabase db push --debug"
          
          # Show migration status for debugging
          echo "📋 Current migration status:"
          supabase migration list || echo "Could not retrieve migration status"
          
          exit 1
        fi
        
        echo "✅ Successfully deployed migrations to production"
         
    - name: Notify deployment success
      if: success()
      run: |
        echo "✅ Deployment completed successfully!"
        echo "- Database migrations applied"
        echo "- Application ready for production"
