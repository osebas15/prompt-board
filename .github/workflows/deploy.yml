# Production Deployment Workflow
# 
# This workflow builds and deploys the application to production
# when code is pushed to the main branch.
#
# Database migrations are handled manually and not included in this CI workflow.
#
# For setup instructions, see: docs/deployment/GITHUB-SECRETS-SETUP.md

name: Deploy to Production

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'supabase/migrations/**'  # Skip CI when only migrations change
  workflow_dispatch: # Allow manual triggering

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production # Require environment protection rules
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        # Use v3 which has more stable behavior
        fetch-depth: 0
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    #- name: Run unit tests
     # run: npm run test:unit
      
    - name: Build application
      run: npm run build
      
    - name: Notify deployment success
      if: success()
      run: |
        echo "✅ Application build completed successfully!"
        echo "  • Frontend application built and ready"
        echo "  • Database migrations handled manually (not in CI)"
