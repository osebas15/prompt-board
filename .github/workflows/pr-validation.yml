name: PR Check

on:
  pull_request:
    branches: [ main ]

jobs:
  check:
    name: Quick PR Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run quick checks
      run: |
        echo "Running lint..."
        npm run lint
        
        echo "Running tests..."
        npm run test:run
        
        echo "Testing build..."
        npm run build
        
        echo "✅ All checks passed!"
