name: PR Check

on:
  pull_request:
    branches: [ main ]

jobs:
  check:
    name: Quick PR Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run linter (non-blocking)
      run: npm run lint
      continue-on-error: true
      
    - name: Run tests
      run: npm run test:run
      
    - name: Build application
      run: npm run build
      
    - name: Complete
      run: echo "✅ All essential checks passed! (Linting warnings may exist but are non-blocking)"
